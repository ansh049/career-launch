name: Career Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Tests (Node.js & Supertest)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017/career-platform-test
      JWT_SECRET: ci-jwt-secret-min-32-chars-long-for-supertest
      NODE_ENV: test
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend Tests & Build (Vitest & Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

  ai-service:
    name: AI Service Tests (Python 3.11 & Pytest)
    runs-on: ubuntu-latest
    env:
      AI_INTERNAL_TOKEN: test-internal-token-for-ci
    defaults:
      run:
        working-directory: ai-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - run: pip install -r requirements.txt
      - run: python -m pytest
